name: Reproduce frozen paper results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Code/requirements.txt
      - name: Install the analysis dependency
        run: python -m pip install -r Code/requirements.txt
      - name: Verify all frozen vectors and result tables
        run: python Code/reproduce_final_results.py --output-dir Reproduced_results
